<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{font:12px/1.6 Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#20232c;background:#f6f7fa}*{box-sizing:border-box}body{margin:0;padding:24px}h1{font-size:22px;margin:0 0 5px;letter-spacing:-.5px}p{margin:5px 0 14px;color:#697181}.tag{font-size:10px;letter-spacing:1.2px;color:#526bee;font-weight:700}section{padding:16px;background:white;border:1px solid #e3e6ee;border-radius:12px;margin:14px 0}label{display:block;margin:8px 0}input[type=checkbox],input[type=radio]{accent-color:#526bee;vertical-align:middle;margin-right:7px}select{border:1px solid #dce0e9;padding:6px;border-radius:6px;background:white;color:#20232c}button,.download{border:0;border-radius:8px;background:#526bee;color:white;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none}button.secondary{background:#e8ecf5;color:#505a6e}button:disabled{opacity:.45;cursor:default}#pages{max-height:138px;overflow:auto}#selection,#oldInfo,#scopeInfo{color:#697181;font-size:11px;overflow-wrap:anywhere}.row{display:flex;gap:15px;align-items:center}.row label{flex:1}#status{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#eef1fb;border-radius:8px;margin:12px 0;max-height:190px;overflow:auto}#status.warning{background:#fff7e6;color:#8a5915}#failureDetails{margin:10px 0;border:1px solid #e3e6ee;border-radius:8px;padding:10px 12px}#failureDetails summary{cursor:pointer;font-weight:600}#failureList{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:10px 0 0;max-height:240px;overflow:auto;color:#697181}#status.error{background:#fff0ed;color:#ae3a24}[hidden]{display:none!important}.hint{font-size:11px;margin:6px 0 0;color:#697181}#download{width:100%;text-align:center;background:#16855b;margin-top:8px}#export{flex:1}footer{margin:14px 0 0;color:#9298a6;font-size:10px}input[type=text]{width:100%;padding:9px 10px;border:1px solid #dce0e9;border-radius:6px;background:white;color:#20232c;font:inherit}#packageNamePreview{overflow-wrap:anywhere;white-space:pre-line}input[type=file]{max-width:100%;font-size:11px}strong{font-weight:600}
</style></head><body><div class="tag">OFFLINE HANDOFF · 1.6.0</div><h1>Figma 离线交付</h1>
<section><strong>交付方式</strong><label><input type="radio" name="mode" value="new" checked>首次导出</label><label><input type="radio" name="mode" value="update">局部更新已有交付包</label><div id="oldPanel" hidden><input id="oldFile" type="file" accept=".zip"><div id="oldInfo">选择上次交付的 ZIP。</div><label><input id="sameFile" type="checkbox">已确认旧交付包属于当前 Figma 文件</label><label><input id="upgradeViewer" type="checkbox">升级交付查看器</label><p class="hint">替换所选 Frame / Section，保留其他区域。</p></div></section>
<section><strong>导出范围</strong><div id="scopeControls"><label><input type="radio" name="scope" value="pages" checked>选择 Pages</label><div id="pages">正在读取页面…</div><label><input type="radio" name="scope" value="selection">Figma 当前选中的 Frame / Section</label></div><div class="row" id="selectionRow"><div id="selection">正在读取选区…</div><button id="refreshSelection" class="secondary" type="button">刷新选区</button></div><div id="connection" class="hint">正在连接 Figma…</div><div id="scopeInfo"></div></section>
<section><label>设计预览 <select id="previewScale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label><p class="hint">切图沿用图层的 SVG / PNG Export；同格式多条时取第一条。</p></section>
<section><label for="packageName"><strong>交付包名称</strong></label><input id="packageName" type="text" placeholder="留空使用默认名称" aria-describedby="packageNamePreview packageNameHint" autocomplete="off"><p id="packageNamePreview" class="hint"></p><p id="packageNameHint" class="hint">压缩包与解压文件夹同名，请在生成前命名。</p></section>
<div class="row"><button id="export">生成离线交付 ZIP</button><button id="cancel" class="secondary" hidden>取消</button></div><div id="status" role="status">就绪。</div><details id="failureDetails" hidden><summary id="failureSummary">导出提示</summary><pre id="failureList"></pre></details><a id="download" class="download" hidden>下载交付包 ZIP</a><footer>解压交付包后打开 index.html。</footer>
<!-- SCRIPTS -->
</body></html>
