<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>离线设计交付</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<div class="workspace" id="workspace">
<aside class="sidebar" id="sidebar">
<div class="library-tabs" role="tablist" aria-label="交付资源">
<button id="pagesTab" class="active" role="tab" aria-selected="true" aria-controls="pagePanel" title="页面 / 画板"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm10 0h6v4h-6zm0 7h6v9h-6zM4 14h7v6H4z"/></svg><span>页面</span></button>
<button id="assetTab" role="tab" aria-selected="false" aria-controls="assetPanel" title="SVG / PNG 切图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v10h-2V6H7v12h5v2H5zm9 12 5-5 3 3-5 5-4 1z"/></svg><span>切图 <small id="assetCount"></small></span></button>
<button id="colorsTab" role="tab" aria-selected="false" aria-controls="colorPanel" title="页面颜色变量"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2S5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13z"/></svg><span>颜色</span></button>
</div>
<div id="pagePanel" role="tabpanel" aria-labelledby="pagesTab"><div class="side-title">页面 / 画板 <span id="pageCount"></span></div><nav id="navigation" aria-label="页面与图层目录"></nav></div>
<div id="assetPanel" role="tabpanel" aria-labelledby="assetTab" hidden><div class="asset-tools"><input id="assetSearch" placeholder="搜索切图名称或图层 ID" aria-label="搜索切图"><select id="assetScope" aria-label="切图范围"><option value="page">当前页面</option><option value="frame">当前画板</option><option value="all">全部页面</option></select><div class="filters"><button data-filter="all" class="active">全部</button><button data-filter="svg">SVG</button><button data-filter="png">PNG</button></div><p id="assetSummary"></p></div><div id="assetList"></div></div>
<div id="colorPanel" role="tabpanel" aria-labelledby="colorsTab" hidden><div class="asset-tools"><input id="colorSearch" placeholder="搜索颜色、变量或样式" aria-label="搜索页面颜色"><p id="colorSummary"></p></div><div id="colorList"></div></div>
</aside>
<main>
<div id="viewport"><div id="stage"><div id="scene"></div></div></div>
<div class="toolbar canvas-dock"><button id="toggleSidebar" class="panel-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="收起左侧目录" title="收起左侧目录"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M7 3v14"/></svg></button><div class="controls"><button id="overview">全页</button><button id="fit">适合宽度</button><span></span><button id="zoomOut" aria-label="缩小">−</button><button id="zoomValue">100%</button><button id="zoomIn" aria-label="放大">＋</button><button id="pan" title="拖动工具（也可按住空格拖动）" aria-label="拖动画布" aria-pressed="false">✥</button><span></span><button id="annotations" class="active" aria-label="显示布局标注" aria-pressed="true">标注 <i></i></button></div><button id="toggleInspector" class="panel-toggle" type="button" aria-controls="inspector" aria-expanded="true" aria-label="收起右侧标注面板" title="收起右侧标注面板"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M13 3v14"/></svg></button></div>
<footer><span id="crumb">设计稿</span><span id="status">点击元素查看尺寸与坐标</span><span>空格 + 拖动 · Ctrl / ⌘ + 滚轮缩放</span></footer>
</main>
<aside class="inspector" id="inspector"><div class="inspect-heading mx-unit"><svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><rect x="1" y="1" width="10" height="16" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span id="unitLabel">网页 - px</span><span>切换单位</span><select id="unitSelect" aria-label="切换单位"><option value="px">网页 - px</option><option value="pt">iOS - pt</option><option value="dp">Android - dp/sp</option></select></div><div id="inspectPanel"></div></aside>
</div><div id="toast" role="status" aria-live="polite"></div><script src="data/design-data.js"></script><script src="spacing.js"></script><script src="viewer.js"></script></body></html>
